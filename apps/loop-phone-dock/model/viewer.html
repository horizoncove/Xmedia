<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LOOP Phone Dock · Three.js</title>
  <style>
    html, body { margin: 0; height: 100%; background: #070b10; color: #d7e7ee; font-family: "Segoe UI", "PingFang SC", sans-serif; }
    canvas { display: block; }
    header { position: fixed; left: 20px; top: 16px; z-index: 2; letter-spacing: .12em; }
    header b { display: block; font-size: 14px; color: #7ee7f5; }
    header span { font-size: 12px; color: #8aa; }
    #err { position: fixed; left: 20px; bottom: 16px; color: #f96; font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <b>LOOP PHONE DOCK</b>
    <span>Blender 导出 · Three.js 查看 · 拖拽旋转</span>
  </header>
  <div id="err"></div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.164.1/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.164.1/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x070b10);
    scene.fog = new THREE.Fog(0x070b10, 0.8, 2.4);

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.01, 20);
    camera.position.set(0.38, 0.28, 0.42);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0.06, 0);
    controls.enableDamping = true;

    scene.add(new THREE.AmbientLight(0x88aacc, 0.45));
    const key = new THREE.DirectionalLight(0xffffff, 2.2);
    key.position.set(0.4, 0.8, 0.3);
    scene.add(key);
    const rim = new THREE.PointLight(0x00e5ff, 8, 2);
    rim.position.set(-0.3, 0.2, -0.2);
    scene.add(rim);

    const grid = new THREE.GridHelper(1.2, 24, 0x143040, 0x0d1a24);
    grid.position.y = -0.01;
    scene.add(grid);

    new GLTFLoader().load(
      "./loop-phone-dock.glb",
      (gltf) => {
        const root = gltf.scene;
        const box = new THREE.Box3().setFromObject(root);
        const center = box.getCenter(new THREE.Vector3());
        root.position.sub(center);
        root.position.y += box.getSize(new THREE.Vector3()).y * 0.5;
        scene.add(root);
      },
      undefined,
      (err) => {
        document.getElementById("err").textContent = "模型没载入：" + err.message;
      }
    );

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    (function tick() {
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
