<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>莫比乌斯环 · 扁平化</title>
<style>
  :root {
    --blue: #4285F4;
    --red: #EA4335;
    --yellow: #FBBC05;
    --green: #34A853;
    --ink: #202124;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: grid;
    place-items: center;
    background: #f8f9fa;
    font-family: 'Roboto', 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: var(--ink);
  }
  .card {
    text-align: center;
    padding: 40px 48px;
    background: #ffffff;
    border-radius: 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,.08);
  }
  .stage { width: 320px; height: 320px; margin: 0 auto 24px; }
  .title { font-size: 22px; font-weight: 500; letter-spacing: .5px; }
  .sub { margin-top: 8px; font-size: 13px; color: #5f6368; }
  .dots { margin-top: 20px; display: flex; gap: 8px; justify-content: center; }
  .dot { width: 9px; height: 9px; border-radius: 50%; }
  .dot.b { background: var(--blue); }
  .dot.r { background: var(--red); }
  .dot.y { background: var(--yellow); }
  .dot.g { background: var(--green); }
</style>
</head>
<body>
  <div class="card">
    <div class="stage">
      <svg viewBox="0 0 320 320" width="320" height="320" role="img" aria-label="莫比乌斯环">
        <defs>
          <linearGradient id="band" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#4285F4"/>
            <stop offset="33%" stop-color="#EA4335"/>
            <stop offset="66%" stop-color="#FBBC05"/>
            <stop offset="100%" stop-color="#34A853"/>
          </linearGradient>
          <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.12"/>
          </filter>
        </defs>

        <!-- 背景环 -->
        <path id="back" fill="none" stroke="#e8eaed" stroke-width="26"
              stroke-linecap="round" opacity="0.6"
              d="M 60 160 A 100 100 0 1 1 260 160 A 100 100 0 1 1 60 160"/>
        <path fill="none" stroke="#f1f3f4" stroke-width="26"
              stroke-linecap="round"
              d="M 60 160 A 100 100 0 1 1 260 160 A 100 100 0 1 1 60 160"/>

        <!-- 莫比乌斯带：一条带子扭转后首尾相连 -->
        <path id="strip" fill="none" stroke="#fff" stroke-width="30"
              stroke-linecap="round" filter="url(#soft)"
              d="M 160 62
                 C 96 62 60 100 60 160
                 C 60 220 96 258 160 258
                 C 224 258 260 220 260 160
                 C 260 100 224 62 160 62 Z"/>
        <path id="grad" fill="none" stroke="url(#band)" stroke-width="26"
              stroke-linecap="round"
              d="M 160 62
                 C 96 62 60 100 60 160
                 C 60 220 96 258 160 258
                 C 224 258 260 220 260 160
                 C 260 100 224 62 160 62 Z"/>

        <!-- 旋转的“扭点” -->
        <g id="travel">
          <circle r="14" fill="none" stroke="#fff" stroke-width="4"/>
          <circle r="9" fill="#202124"/>
        </g>
      </svg>
    </div>
    <div class="title">莫比乌斯环</div>
    <div class="sub">Möbius Strip · 无限与循环</div>
    <div class="dots">
      <span class="dot b"></span><span class="dot r"></span>
      <span class="dot y"></span><span class="dot g"></span>
    </div>
  </div>

  <script>
    const strip = document.getElementById('grad');
    const len = strip.getTotalLength();
    strip.style.strokeDasharray = len;
    strip.style.strokeDashoffset = len;

    const travel = document.getElementById('travel');
    const BOUNCE = 0.5; // 0..1 控制正/反面的“跳动”

    function frame(t) {
      const p = (t / 1000) % 1;
      // 在带子上沿路径前进
      const pt = strip.getPointAtLength(p * len);
      const tang = strip.getPointAtLength(Math.min((p * len) + 1, len));
      const angle = Math.atan2(tang.y - pt.y, tang.x - pt.x) * 180 / Math.PI;

      // 模拟莫比乌斯的扭转：绕过一圈后翻面
      const flip = Math.sin(p * Math.PI * 2);
      const scaleY = 1 - BOUNCE * Math.abs(flip);

      travel.setAttribute('transform',
        `translate(${pt.x} ${pt.y}) rotate(${angle}) scale(1 ${scaleY})`);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
